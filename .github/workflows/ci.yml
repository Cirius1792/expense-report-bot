name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      upload-coverage: true
    # Test code runs with a read-only token (the default can be read-write).
    permissions:
      contents: read
    # Cancel superseded runs on the same ref so rapid pushes do not pile up.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

  version-check:
    name: version-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          # The gate diffs the PR base against its head and reads files at those
          # commits with `git show`; a shallow clone lacks the base commit.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Check pull request version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --no-project: the gate is stdlib-only. Never install the project or
        # rewrite the lockfile while validating that same lockfile.
        run: uv run --no-project python -m scripts.check_pr_version "$BASE_SHA" "$HEAD_SHA"

  generate-badge:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
      - name: Generate coverage badge
        run: |
          # coverage-badge imports pkg_resources (removed from setuptools>=81),
          # so pin setuptools<81 — uv installs setuptools 84 by default.
          pip install "coverage-badge" "setuptools<81"
          coverage-badge -o coverage.svg -f
      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: update coverage badge"
          file_pattern: coverage.svg
